# Render Blueprint: New → Blueprint → pick this repository. Creates the database and the web service.
databases:
  - name: sportsiq-db
    plan: free
    databaseName: sportsiq
    user: sportsiq

services:
  - type: web
    name: sportsiq
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sportsiq-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_EMAIL
        value: admin@sportsiq.in
      - key: SUPERADMIN_PASSWORD
        sync: false            # you type this in when creating the Blueprint
      - key: SEED_DEMO
        value: "true"          # loads the demo league on first boot; set to false for a clean launch
      - key: PAYMENTS_TEST_MODE
        value: "true"          # labelled test payments until Razorpay keys are added
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
